name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the scripts parse
        run: |
          for f in module/post-fs-data.sh module/service.sh module/uninstall.sh module/customize.sh module/action.sh module/bin/oplusdolby.sh; do
            sh -n "$f" || { echo "syntax error in $f"; exit 1; }
          done

      - name: Package the module
        run: |
          mkdir -p dist
          cp -f module/module.prop module/customize.sh module/post-fs-data.sh \
                module/service.sh module/action.sh module/uninstall.sh module/README.md dist/
          mkdir -p dist/bin && cp -f module/bin/oplusdolby.sh dist/bin/
          cp -R webroot dist/webroot
          test -f dist/webroot/index.html || { echo "webroot/index.html missing"; exit 1; }
          # module.prop has to sit at the archive root - that is what the installer reads
          test -f dist/module.prop || { echo "module.prop missing from the package"; exit 1; }
          (cd dist && zip -r9 ../OplusDolby.zip .)

      - uses: actions/upload-artifact@v4
        with:
          name: OplusDolby
          path: OplusDolby.zip

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OplusDolby.zip
